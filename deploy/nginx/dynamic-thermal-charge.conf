# nginx site for Dynamic Thermal Charge.
#
# Serves the web panel and proxies the API. Two properties come out of that
# combination and both are worth more than the convenience:
#
#   * The browser sees a SINGLE origin, so no cross-origin configuration is
#     needed and the persisted CORS origin list can stay empty, which is its default and
#     its safest value.
#   * The API keeps listening only on 127.0.0.1. nginx is the ONLY component
#     exposed on the network.
#
# Install:
#   sudo install -m 0644 dynamic-thermal-charge.conf \
#     /etc/nginx/sites-available/dynamic-thermal-charge
#   sudo ln -sf /etc/nginx/sites-available/dynamic-thermal-charge \
#     /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/dynamic-thermal-charge;
    index index.html;

    # Small responses; the panel is ~74 kB transferred.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------------
    # 1. Reloading an internal route of the panel.
    #
    # Without this, reloading /configuracion returns 404: no such file exists on
    # disk, only index.html and the panel's own router.
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------------
    # 2. Caching, derived from the file names themselves.
    #
    # The build puts a fingerprint in the name of every asset whose content can
    # change, so they are immutable by construction and caching them is free.
    # ------------------------------------------------------------------------
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html is NOT cached. It is the entry point that points at the
    # fingerprinted assets, and caching it is exactly the failure that makes the
    # operator deploy a new version, reload, and keep seeing the old interface.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # ------------------------------------------------------------------------
    # 3. The API, on the device's own local interface.
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # The credential header must arrive intact. nginx does not strip it, but
        # declaring it keeps a future change from breaking it silently and
        # leaving every request answering 401.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # The API's health check, for an external monitor. Reveals nothing.
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }

    # /docs and /openapi.json are deliberately NOT proxied. They require the
    # credential, so exposing them would not be a hole, but the panel does not
    # use them and publishing them widens the network surface for nothing.
}

# ---------------------------------------------------------------------------
# Encryption in transit. Deliberately COMMENTED OUT.
#
# Not enabled by this phase, because it means managing certificates and that is
# the operator's call. It is here so whoever needs it does not have to invent it.
#
# WITHOUT it, the panel and the API serve in CLEAR TEXT: anyone on the network
# can read the credential in transit, and whoever holds it can change the
# maximum power and the pin assignments. Reasonable on a trusted home network.
# NOT reasonable exposed to the internet.
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name pi.example.lan;
#
#     ssl_certificate     /etc/ssl/certs/dynamic-thermal-charge.crt;
#     ssl_certificate_key /etc/ssl/private/dynamic-thermal-charge.key;
#     ssl_protocols TLSv1.2 TLSv1.3;
#
#     # ... the same root, locations and proxy_pass as the block above ...
# }
#
