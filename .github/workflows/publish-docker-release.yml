name: Publish Docker release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency: { group: docker-release, cancel-in-progress: false }

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        # Home Assistant 2026.9.1 requires Python >=3.14.2.
        with: { python-version: '3.14' }
      - uses: actions/setup-node@v6
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install dependencies
        run: make setup
      - name: Quality gate
        run: make check

  publish:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image metadata
        id: image-metadata
        run: |
          echo "vcs_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "backend_lock_sha256=$(sha256sum backend/requirements.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "frontend_lock_sha256=$(sha256sum frontend/package-lock.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        run: |
          case "$RELEASE_VERSION" in
            ''|*[!A-Za-z0-9_.-]*)
              echo "Invalid Docker image tag: $RELEASE_VERSION" >&2
              exit 1
              ;;
          esac
          if [ "${#RELEASE_VERSION}" -gt 128 ]; then
            echo "Docker image tag is longer than 128 characters" >&2
            exit 1
          fi
      - name: Build and push backend runtime image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dynamic-thermal-charge-backend:${{ env.RELEASE_VERSION }}
          sbom: true
          provenance: mode=max
          build-args: |
            DTC_BUILD_VERSION=${{ env.RELEASE_VERSION }}
            DTC_VCS_REF=${{ steps.image-metadata.outputs.vcs_ref }}
            DTC_BUILD_DATE=${{ github.event.release.published_at }}
            DTC_LOCK_SHA256=${{ steps.image-metadata.outputs.backend_lock_sha256 }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dynamic-thermal-charge-frontend:${{ env.RELEASE_VERSION }}
          sbom: true
          provenance: mode=max
          build-args: |
            APP_VERSION=${{ env.RELEASE_VERSION }}
            DTC_BUILD_VERSION=${{ env.RELEASE_VERSION }}
            DTC_VCS_REF=${{ steps.image-metadata.outputs.vcs_ref }}
            DTC_BUILD_DATE=${{ github.event.release.published_at }}
            DTC_LOCK_SHA256=${{ steps.image-metadata.outputs.frontend_lock_sha256 }}
      - name: Update GitOps release pointer
        run: |
          git fetch --quiet origin main
          git switch --create release-publish origin/main
          printf '%s\n' "$RELEASE_VERSION" > deploy/release
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/release
          if git diff --cached --quiet; then
            echo "deploy/release already points to $RELEASE_VERSION"
          else
            git commit -m "chore(release): deploy $RELEASE_VERSION"
            git push origin HEAD:main
          fi
