name: CI
on:
  push:
    branches: [main]
    paths-ignore: [deploy/release]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v6
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      # The same two commands a developer runs, so CI cannot drift from the
      # local gate. `make check` covers both components: pytest and ruff for the
      # backend, vitest and the production build for the panel, plus the Compose
      # descriptors.
      - name: Install dependencies
        run: make setup
      - name: Quality gate
        run: make check
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: dynamic-thermal-charge-backend:ci-${{ github.sha }}
      - name: Build frontend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: dynamic-thermal-charge-frontend:ci-${{ github.sha }}
          build-args: APP_VERSION=ci-${{ github.sha }}
