name: CI/CD
on:
  push:
    branches: [main]
    paths-ignore: [deploy/release]
  pull_request:
    branches: [main]
permissions: { contents: write }
concurrency: { group: app-release, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -e '.[dev]'
      - run: make check
      - run: npm ci --prefix frontend && npm run build --prefix frontend
  publish:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { username: '${{ secrets.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, push: true, tags: '${{ secrets.DOCKERHUB_USERNAME }}/dynamic-thermal-charge-backend:${{ github.sha }}' }
      - uses: docker/build-push-action@v6
        with: { context: ., file: frontend/Dockerfile, push: true, tags: '${{ secrets.DOCKERHUB_USERNAME }}/dynamic-thermal-charge-frontend:${{ github.sha }}' }
      - run: echo '${{ github.sha }}' > deploy/release
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add deploy/release && git commit -m "chore(release): ${{ github.sha }}" || true
      - run: git push origin HEAD:main
