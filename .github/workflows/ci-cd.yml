name: CI
on:
  push:
    branches: [main]
    paths-ignore: [deploy/release]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        # Home Assistant 2026.9.1 requires Python >=3.14.2.
        with: { python-version: '3.14' }
      - uses: actions/setup-node@v6
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      # The same two commands a developer runs, so CI cannot drift from the
      # local gate. `make check` covers both components: pytest and ruff for the
      # backend, vitest and the production build for the panel, plus the Compose
      # descriptors.
      - name: Install dependencies
        run: make setup
      - name: Quality gate
        run: make check
      - name: Compute image metadata
        id: image-metadata
        run: |
          echo "backend_lock_sha256=$(sha256sum backend/requirements.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "frontend_lock_sha256=$(sha256sum frontend/package-lock.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: dynamic-thermal-charge-backend:ci-${{ github.sha }}
          build-args: |
            DTC_BUILD_VERSION=ci-${{ github.sha }}
            DTC_VCS_REF=${{ github.sha }}
            DTC_BUILD_DATE=unknown
            DTC_LOCK_SHA256=${{ steps.image-metadata.outputs.backend_lock_sha256 }}
      - name: Build backend ARMv7 image without publishing
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/arm/v7
          push: false
          tags: dynamic-thermal-charge-backend:ci-${{ github.sha }}-armv7
          build-args: |
            DTC_BUILD_VERSION=ci-${{ github.sha }}-armv7
            DTC_VCS_REF=${{ github.sha }}
            DTC_BUILD_DATE=unknown
            DTC_LOCK_SHA256=${{ steps.image-metadata.outputs.backend_lock_sha256 }}
      - name: Build frontend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: dynamic-thermal-charge-frontend:ci-${{ github.sha }}
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            DTC_BUILD_VERSION=ci-${{ github.sha }}
            DTC_VCS_REF=${{ github.sha }}
            DTC_BUILD_DATE=unknown
            DTC_LOCK_SHA256=${{ steps.image-metadata.outputs.frontend_lock_sha256 }}
