name: CI/CD
on:
  push:
    branches: [main]
    paths-ignore: [deploy/release]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency: { group: app-release, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install backend test dependencies
        run: pip install -e '.[dev]'
      - name: Run backend checks
        run: make check
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Compile frontend
        run: npm run build
        working-directory: frontend
  publish:
    if: github.event_name == 'push'
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: '${{ secrets.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}' }
      - name: Build and push backend runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dynamic-thermal-charge-backend:${{ github.sha }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dynamic-thermal-charge-frontend:${{ github.sha }}
      - name: Record published release
        env:
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > deploy/release
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/release
          if git diff --cached --quiet; then
            echo "deploy/release already points to $RELEASE_VERSION"
          else
            git commit -m "chore(release): $RELEASE_VERSION"
            git push origin HEAD:main
          fi
