name: CI
on:
  push:
    branches: [main]
    paths-ignore: [deploy/release]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v6
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install backend test dependencies
        run: pip install -e 'backend[dev]'
      - name: Run backend checks
        run: make check
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Compile frontend
        run: npm run build
        working-directory: frontend
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: dynamic-thermal-charge-backend:ci-${{ github.sha }}
      - name: Build frontend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: dynamic-thermal-charge-frontend:ci-${{ github.sha }}
