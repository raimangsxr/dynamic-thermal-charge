# NO LO LEE EL RUNTIME.
#
# Desde la feature 001-config-database la configuración vive en base de datos
# (SQLite local o PostgreSQL remoto), indicada por DTC_DATABASE_URL. Este fichero
# se conserva solo como documentación de los campos disponibles y como
# referencia de la instalación que siembra `dtc db init`.
#
# Para ver o cambiar la configuración real:
#   dtc config show
#   dtc config set max_total_power_kw 5.2
#
logging:
  level: INFO

site:
  max_total_power_kw: 5.5
  slot_minutes: 30
  window_hours: 8

heaters:
  - id: salon
    name: Salón
    model: ADS-2812
    power_kw: 2.8
    full_charge_hours: 8
    target_charge: 0.75
    priority: 90
    output:
      type: simulated

  - id: entrada
    name: Entrada
    model: ADS-2412
    power_kw: 2.4
    full_charge_hours: 8
    target_charge: 0.50
    priority: 50
    output:
      type: simulated

  - id: habitaciones
    name: Habitaciones
    model: ADS-2412
    power_kw: 2.4
    full_charge_hours: 8
    target_charge: 0.75
    priority: 100
    output:
      type: simulated

  - id: buhardilla
    name: Buhardilla
    model: ADS-2412
    power_kw: 2.4
    full_charge_hours: 8
    target_charge: 0.25
    priority: 40
    output:
      type: simulated
