# Ejemplo de despliegue para Raspberry Pi 2B.
# IMPORTANTE: los GPIO solo deben gobernar entradas aisladas de relés/contactores
# dimensionados por un electricista. Nunca conecte un acumulador directamente al GPIO.

logging:
  level: DEBUG

schedule:
  timezone: Europe/Madrid
  start_time: "00:00"
  end_time: "08:00"
  weekdays:
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    - sunday

weather:
  provider: aemet
  aemet:
    # Código INE de 5 dígitos del municipio de la vivienda.
    municipality_code: "15057"
    api_key_env: AEMET_API_KEY
    timeout_seconds: 10
  # Valores conservadores usados si falta la API key, la red o falla AEMET.
  fallback:
    average_temperature_c: 8.0
    minimum_temperature_c: 3.0
  watchdog:
    retry_minutes: 15
    refresh_minutes: 180

site:
  # Límite exclusivo para los acumuladores. Debe ajustarse a la instalación,
  # potencia contratada y margen necesario para el resto de la vivienda.
  max_total_power_kw: 5.2
  slot_minutes: 30

heaters:
  - id: salon
    name: Salón
    model: ADS-2812
    power_kw: 2.8
    full_charge_hours: 8
    priority: 90
    thermal:
      target_temperature_c: 21.0
      design_outdoor_temperature_c: -2.0
      thermal_factor: 1.0
      min_charge: 0.10
      max_charge: 1.0
    output:
      type: gpio
      pin: 17  # BCM 17, pin físico 11
      active_high: false

  - id: entrada
    name: Entrada
    model: ADS-2412
    power_kw: 2.4
    full_charge_hours: 8
    priority: 50
    thermal:
      target_temperature_c: 18.0
      design_outdoor_temperature_c: 0.0
      thermal_factor: 0.70
      min_charge: 0.0
      max_charge: 0.80
    output:
      type: gpio
      pin: 18  # BCM 18, pin físico 12
      active_high: false

  - id: habitaciones
    name: Habitaciones
    model: ADS-2412
    power_kw: 2.4
    full_charge_hours: 8
    priority: 100
    thermal:
      target_temperature_c: 20.5
      design_outdoor_temperature_c: -2.0
      thermal_factor: 1.05
      min_charge: 0.10
      max_charge: 1.0
    output:
      type: gpio
      pin: 22  # BCM 22, pin físico 15
      active_high: false

  - id: buhardilla
    name: Buhardilla
    model: ADS-2412
    power_kw: 2.4
    full_charge_hours: 8
    priority: 40
    thermal:
      target_temperature_c: 17.0
      design_outdoor_temperature_c: -2.0
      thermal_factor: 0.65
      min_charge: 0.0
      max_charge: 0.75
    output:
      type: gpio
      pin: 23  # BCM 23, pin físico 16
      active_high: false
