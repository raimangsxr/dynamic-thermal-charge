[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-thermal-charge"
version = "0.1.0"
description = "Configurable storage-heater charge scheduler for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# No runtime dependencies: configuration lives in a database, reached through
# the optional "db" extra, and the scheduler needs nothing but the stdlib.
dependencies = []

[project.optional-dependencies]
# Persistence. Kept optional so the scheduler and the thermal model stay
# importable without them (constitution principle VI).
db = ["SQLAlchemy>=2,<3", "alembic>=1.13"]
# Pure-Python PostgreSQL driver: the only one installable on ARMv7 without a
# compiler or libpq (see specs/001-config-database/research.md, D2).
postgres = ["pg8000>=1.31"]
dev = ["pytest>=8,<10", "SQLAlchemy>=2,<3", "alembic>=1.13"]
gpio = ["gpiozero>=2.0.1,<3", "lgpio>=0.2.2.0"]

[project.scripts]
dynamic-thermal-charge = "dynamic_thermal_charge.cli:main"
dtc = "dynamic_thermal_charge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: requires a real PostgreSQL server; skipped unless DTC_TEST_POSTGRES_URL is set",
]
