[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-thermal-charge"
version = "0.1.0"
description = "Configurable storage-heater charge scheduler for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
dynamic-thermal-charge = "dynamic_thermal_charge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
