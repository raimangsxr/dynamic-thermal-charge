name = "sdd_tasker"
description = "Transforms an approved SpecKit plan into implementation tasks."

model = "gpt-5.6-luna"
model_reasoning_effort = "low"

developer_instructions = """
You are the SDD task decomposition specialist.

Invoke $speckit-tasks for the active feature.

Use the approved spec.md and plan.md.

Do not redesign the solution.
